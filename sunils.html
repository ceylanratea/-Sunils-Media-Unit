<!doctype html>
<html lang="si">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>සුනිල්ස් තේ කර්මාන්ත ශාලාව</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font (Sinhala) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --tea-dark: #0f2a16;
            --tea-mid: #1f4028;
            --tea-green: #4c8b3a;
            --tea-light: #75b843;
            --tea-pale: #a8d08a;
            --gold: #d4a843;
            --card-glass: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans Sinhala", sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 50%, #1a4025 0%, var(--tea-dark) 70%);
            color: #e8f0e0;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== FULL PAGE LEAF PATTERN OVERLAY ===== */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(117, 184, 67, 0.04) 0%, transparent 30%),
                radial-gradient(circle at 85% 70%, rgba(117, 184, 67, 0.05) 0%, transparent 35%),
                radial-gradient(circle at 45% 85%, rgba(168, 208, 138, 0.03) 0%, transparent 28%),
                radial-gradient(circle at 70% 15%, rgba(75, 139, 58, 0.04) 0%, transparent 32%),
                radial-gradient(circle at 5% 60%, rgba(168, 208, 138, 0.03) 0%, transparent 25%),
                radial-gradient(circle at 95% 40%, rgba(75, 139, 58, 0.03) 0%, transparent 30%);
        }

        /* ===== FLOATING LEAF PARTICLES ===== */
        .leaf-particle {
            position: fixed;
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            animation: leafFloat linear infinite;
            will-change: transform;
            filter: drop-shadow(0 0 8px rgba(117, 184, 67, 0.1));
        }

        @keyframes leafFloat {
            0% {
                transform: translateY(-20vh) rotate(0deg) scale(0.8);
                opacity: 0.02;
            }
            25% {
                transform: translateY(20vh) translateX(80px) rotate(90deg) scale(1.2);
                opacity: 0.12;
            }
            50% {
                transform: translateY(50vh) translateX(-60px) rotate(180deg) scale(0.9);
                opacity: 0.08;
            }
            75% {
                transform: translateY(75vh) translateX(90px) rotate(270deg) scale(1.1);
                opacity: 0.15;
            }
            100% {
                transform: translateY(110vh) translateX(-40px) rotate(360deg) scale(0.7);
                opacity: 0.02;
            }
        }

        /* ===== FALLING LEAVES ===== */
        .falling-leaf {
            position: fixed;
            top: -60px;
            pointer-events: none;
            z-index: 9997;
            font-size: 1.8rem;
            animation: fall linear forwards;
            will-change: transform;
            filter: drop-shadow(0 0 18px rgba(117, 184, 67, 0.2));
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-60px) translateX(0) rotate(0deg) scale(0.8);
                opacity: 0.8;
            }
            20% {
                transform: translateY(20vh) translateX(60px) rotate(120deg) scale(1.1);
            }
            40% {
                transform: translateY(40vh) translateX(-40px) rotate(240deg) scale(0.9);
            }
            60% {
                transform: translateY(60vh) translateX(70px) rotate(360deg) scale(1.05);
            }
            80% {
                transform: translateY(80vh) translateX(-30px) rotate(480deg) scale(0.95);
            }
            100% {
                transform: translateY(110vh) translateX(40px) rotate(600deg) scale(0.6);
                opacity: 0;
            }
        }

        /* ===== GLASS NAVBAR ===== */
        .glass-nav {
            background: rgba(15, 42, 22, 0.85);
            backdrop-filter: blur(18px) saturate(180%);
            border-bottom: 1px solid var(--border-glass);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            z-index: 9996;
            position: relative;
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--gold) !important;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
            text-shadow: 0 0 20px rgba(212, 168, 67, 0.1);
            line-height: 1.2;
        }
        .navbar-brand:hover {
            transform: translateX(-4px);
        }

        .nav-link {
            color: rgba(232, 240, 224, 0.7) !important;
            font-weight: 600;
            padding: 0.5rem 1rem !important;
            border-radius: 40px;
            transition: all 0.25s ease;
            position: relative;
            font-size: 0.85rem;
        }
        .nav-link::after {
            content: "🌿";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            font-size: 0.6rem;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            transform: translateY(-50%) scale(1);
            opacity: 0.8;
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--tea-pale) !important;
            background: rgba(117, 184, 67, 0.12);
            text-shadow: 0 0 20px rgba(117, 184, 67, 0.1);
        }
        .nav-link.active {
            color: var(--gold) !important;
            background: rgba(212, 168, 67, 0.08);
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            text-align: center;
            padding: 16px 0 8px;
            position: relative;
            z-index: 1;
        }
        .section-title .eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            background: rgba(212, 168, 67, 0.08);
            padding: 0.25rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(212, 168, 67, 0.1);
            display: inline-block;
            margin-bottom: 6px;
        }
        .section-title h1 {
            font-weight: 800;
            color: #ffffff;
            font-size: 2.2rem;
            line-height: 1.15;
            text-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
        }
        .section-title h1::after {
            content: " 🍃";
            display: inline-block;
            animation: leafWiggle 4s ease-in-out infinite;
        }
        @keyframes leafWiggle {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(15deg);
            }
        }
        .section-title p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.92);
            max-width: 500px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* ===== SERVICE GRID ===== */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 24px;
            position: relative;
            z-index: 1;
        }

        .service-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 16px 22px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            min-height: 170px;
            color: #e8f0e0;
            background-color: rgba(15, 42, 22, 0.5);
            border: none;
            outline: none;
            font-family: inherit;
            width: 100%;
        }

        .service-card::before {
            content: "🍃";
            position: absolute;
            bottom: -10px;
            right: -5px;
            font-size: 4.5rem;
            opacity: 0.04;
            transform: rotate(25deg);
            pointer-events: none;
            transition: all 0.5s ease;
        }
        .service-card:hover::before {
            opacity: 0.12;
            transform: rotate(35deg) scale(1.1);
        }

        .service-card::after {
            content: "";
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border-radius: 20px;
            border: 1.5px dashed rgba(255, 215, 0, 0.06);
            pointer-events: none;
            transition: border-color 0.4s ease;
        }
        .service-card:hover::after {
            border-color: rgba(212, 168, 67, 0.15);
        }

        .service-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(212, 168, 67, 0.2);
            box-shadow: 0 0 50px rgba(117, 184, 67, 0.06), 0 16px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            background: rgba(30, 60, 35, 0.6);
        }

        .service-card.selected {
            border-color: var(--gold);
            background: rgba(30, 60, 35, 0.7);
            box-shadow: 0 0 50px rgba(212, 168, 67, 0.08);
        }

        .service-card span {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 20px rgba(117, 184, 67, 0.1));
            line-height: 1;
        }
        .service-card strong {
            display: block;
            font-size: 1rem;
            margin: 2px 0 4px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }
        .service-card small {
            font-size: 0.75rem;
            color: rgba(200, 230, 200, 0.8);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ===== SERVICE PANEL ===== */
        .service-panel {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 20px;
            min-height: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .service-panel::before {
            content: "🌿";
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 6rem;
            opacity: 0.03;
            pointer-events: none;
            transform: rotate(-10deg);
        }
        .service-panel .eyebrow {
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            background: rgba(212, 168, 67, 0.08);
            padding: 0.15rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(212, 168, 67, 0.08);
            display: inline-block;
            margin-bottom: 4px;
        }
        .service-panel h3 {
            font-weight: 800;
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .service-panel p {
            color: rgba(255, 255, 255, 0.93);
            font-size: 0.95rem;
            line-height: 1.7;
            max-width: 600px;
            font-weight: 400;
        }
        .service-panel .panel-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        .service-panel .action-btn {
            display: inline-block;
            background: rgba(117, 184, 67, 0.12);
            border: 1px solid rgba(117, 184, 67, 0.15);
            color: var(--tea-pale);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            text-align: center;
        }
        .service-panel .action-btn:hover {
            background: rgba(117, 184, 67, 0.2);
            border-color: var(--tea-green);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(117, 184, 67, 0.08);
            color: #ffffff;
        }

        .service-panel .row img {
            border-radius: 14px;
            transition: transform 0.3s ease;
            height: 100px;
            width: 100%;
            object-fit: cover;
        }
        .service-panel .row img:hover {
            transform: scale(1.04);
        }

        .empty-panel {
            text-align: center;
            color: rgba(200, 230, 200, 0.5);
            padding: 30px 16px;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .empty-panel::before {
            content: "🍃 ";
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.3;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(5, 13, 5, 0.6);
            backdrop-filter: blur(8px);
            color: rgba(200, 230, 200, 0.6);
            padding: 16px 0;
            border-top: 1px solid var(--border-glass);
            position: relative;
            z-index: 1;
            margin-top: 20px;
            font-size: 0.8rem;
        }
        .socials {
            display: flex;
            gap: 8px;
        }
        .socials a {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(200, 230, 200, 0.5);
            display: grid;
            place-items: center;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid var(--border-glass);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .socials a:hover {
            background: var(--gold);
            color: #0a140a;
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.15);
            border-color: var(--gold);
        }

        /* ===== CAROUSEL ===== */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.8));
        }
        .carousel-indicators [data-bs-target] {
            background-color: var(--gold);
        }
        .carousel-inner img {
            height: 420px;
            object-fit: cover;
            width: 100%;
            background: #1a4025;
        }

        /* ===== IMAGE PLACEHOLDER STYLES (fallback) ===== */
        .img-placeholder {
            background: linear-gradient(135deg, #1a4025, #2d5a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: rgba(255, 255, 255, 0.15);
            min-height: 100px;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
        }
        .img-placeholder-sm {
            min-height: 70px;
            font-size: 1.8rem;
        }

        /* ===== TOURISM HIGHLIGHT CARDS ===== */
        .tourism-highlight {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease;
        }
        .tourism-highlight:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .tourism-highlight h5 {
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
        }
        .tourism-highlight p {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 0.88rem !important;
            margin-bottom: 0;
        }

        /* ===== PROCESS STEP ===== */
        .process-step {
            text-align: center;
            padding: 14px 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s ease;
        }
        .process-step:hover {
            background: rgba(255, 255, 255, 0.07);
        }
        .process-step .icon {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 4px;
        }
        .process-step h6 {
            font-weight: 700;
            color: #ffffff;
            font-size: 0.85rem;
            margin-bottom: 0;
        }
        .process-step small {
            color: rgba(200, 230, 200, 0.7);
            font-size: 0.7rem;
        }

        /* ===== ENGLISH GUIDE ===== */
        .guide-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 20px 18px;
            border-left: 4px solid var(--gold);
        }
        .guide-box h4 {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .guide-box p {
            color: rgba(255, 255, 255, 0.92) !important;
            font-size: 0.9rem !important;
        }
        .guide-box ol {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.88rem;
            padding-left: 1.4rem;
            line-height: 1.7;
        }
        .guide-box ol li {
            margin-bottom: 4px;
        }

        /* ============================================================ */
        /* ===== MOBILE RESPONSIVE STYLES ===== */
        /* ============================================================ */

        @media (max-width: 992px) {
            .service-grid {
                gap: 14px;
            }
            .service-card {
                min-height: 150px;
                padding: 20px 14px;
            }
            .service-card span {
                font-size: 2rem;
            }
            .service-card strong {
                font-size: 0.9rem;
            }
            .section-title h1 {
                font-size: 2rem;
            }
            .carousel-inner img {
                height: 340px;
            }
        }

        @media (max-width: 768px) {
            .service-grid {
                grid-template-columns: 1fr;
                gap: 14px;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            .service-card {
                min-height: 100px;
                padding: 16px 14px;
                border-radius: 20px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 14px;
                text-align: left;
                align-items: center;
                background-color: rgba(15, 42, 22, 0.6);
            }
            .service-card span {
                font-size: 2rem;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            .service-card strong {
                font-size: 0.95rem;
                margin: 0;
                text-align: left;
            }
            .service-card small {
                font-size: 0.7rem;
                text-align: left;
            }
            .service-card::before {
                font-size: 3.5rem;
            }
            .service-card::after {
                top: 4px;
                left: 4px;
                right: 4px;
                bottom: 4px;
                border-radius: 16px;
            }
            .service-card .card-text-wrap {
                display: flex;
                flex-direction: column;
            }

            .section-title h1 {
                font-size: 1.7rem;
            }
            .section-title h1::after {
                content: " 🍃";
                font-size: 1.4rem;
            }
            .section-title p {
                font-size: 0.85rem;
                color: rgba(255, 255, 255, 0.88);
            }

            .service-panel {
                padding: 18px 14px;
                border-radius: 20px;
                min-height: 140px;
            }
            .service-panel h3 {
                font-size: 1.1rem;
                gap: 6px;
            }
            .service-panel p {
                font-size: 0.88rem;
                line-height: 1.6;
                color: rgba(255, 255, 255, 0.92);
            }
            .service-panel .panel-actions {
                gap: 8px;
            }
            .service-panel .action-btn {
                font-size: 0.78rem;
                padding: 6px 14px;
            }
            .service-panel .row img {
                height: 70px;
            }
            .carousel-inner img {
                height: 280px !important;
            }

            .guide-box {
                padding: 16px 14px;
            }
            .guide-box h4 {
                font-size: 1rem;
            }
            .guide-box p,
            .guide-box ol {
                font-size: 0.82rem !important;
            }
            .guide-box ol {
                padding-left: 1.2rem;
            }
            .tourism-highlight h5 {
                font-size: 0.9rem;
            }
            .tourism-highlight p {
                font-size: 0.8rem !important;
            }
            .process-step .icon {
                font-size: 1.8rem;
            }
            .process-step h6 {
                font-size: 0.75rem;
            }
            .process-step small {
                font-size: 0.6rem;
            }
            .navbar-brand {
                font-size: 0.85rem;
                gap: 6px;
            }
            .nav-link {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem !important;
            }
            .footer {
                font-size: 0.7rem;
                padding: 12px 0;
            }
            .socials a {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .section-title h1 {
                font-size: 1.4rem;
            }
            .section-title .eyebrow {
                font-size: 0.55rem;
                padding: 0.2rem 0.8rem;
            }
            .section-title p {
                font-size: 0.78rem;
                color: rgba(255, 255, 255, 0.85);
            }
            .service-grid {
                gap: 10px;
                max-width: 100%;
                padding: 0 4px;
            }
            .service-card {
                min-height: 80px;
                padding: 12px 12px;
                border-radius: 16px;
                gap: 10px;
                background-color: rgba(15, 42, 22, 0.7);
            }
            .service-card span {
                font-size: 1.6rem;
            }
            .service-card strong {
                font-size: 0.82rem;
            }
            .service-card small {
                font-size: 0.6rem;
            }
            .service-card::before {
                font-size: 2.8rem;
            }
            .service-card::after {
                top: 3px;
                left: 3px;
                right: 3px;
                bottom: 3px;
                border-radius: 12px;
            }
            .service-panel {
                padding: 14px 12px;
                border-radius: 16px;
                min-height: 120px;
            }
            .service-panel .eyebrow {
                font-size: 0.5rem;
                padding: 0.1rem 0.7rem;
            }
            .service-panel h3 {
                font-size: 0.95rem;
                margin-bottom: 6px;
            }
            .service-panel p {
                font-size: 0.8rem;
                line-height: 1.5;

            // ---- CARD CLICK HANDLER ----
            document.querySelectorAll(".service-card").forEach(btn => {
                btn.addEventListener("click", function() {
                    document.querySelectorAll(".service-card").forEach(b => b.classList.remove("selected"));
                    this.classList.add("selected");
                    const service = this.dataset.service;
                    panel.innerHTML = serviceData[service] ||
                        '<div class="empty-panel">👆 සේවාව තෝරන්න</div>';

                    if (service === 'tourism') {
                        const carouselEl = document.getElementById('teaTourismCarousel');
                        if (carouselEl) {
                            const existing = bootstrap.Carousel.getInstance(carouselEl);
                            if (existing) existing.dispose();
                            new bootstrap.Carousel(carouselEl, {
                                ride: 'carousel',
                                interval: 3000,
                                wrap: true
                            });
                        }
                        setTimeout(() => {
                            const imgs = carouselEl.querySelectorAll('img');
                            const width = window.innerWidth;
                            let height = 420;
                            if (width < 480) height = 200;
                            else if (width < 768) height = 280;
                            else if (width < 992) height = 340;
                            imgs.forEach(img => {
                                img.style.height = height + 'px';
                            });
                            const placeholders = carouselEl.querySelectorAll('.img-placeholder');
                            placeholders.forEach(el => {
                                el.style.height = height + 'px';
                                el.style.minHeight = 'unset';
                            });
                        }, 150);
                    }
                    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
                });
            });

            // ---- BOOTSTRAP CAROUSEL AUTO-INIT ----
            document.querySelectorAll('.carousel').forEach(el => {
                if (!bootstrap.Carousel.getInstance(el)) {
                    new bootstrap.Carousel(el, {
                        ride: 'carousel',
                        interval: 3000,
                        wrap: true
                    });
                }
            });

            // ---- FIX CAROUSEL HEIGHT ON RESIZE ----
            function fixCarouselHeights() {
                const carouselEl = document.getElementById('teaTourismCarousel');
                if (!carouselEl) return;
                const imgs = carouselEl.querySelectorAll('img');
                const placeholders = carouselEl.querySelectorAll('.img-placeholder');
                const width = window.innerWidth;
                let height = 420;
                if (width < 480) height = 200;
                else if (width < 768) height = 280;
                else if (width < 992) height = 340;
                imgs.forEach(img => {
                    img.style.height = height + 'px';
                });
                placeholders.forEach(el => {
                    el.style.height = height + 'px';
                    el.style.minHeight = 'unset';
                });
            }
            window.addEventListener('resize', fixCarouselHeights);
            setTimeout(fixCarouselHeights, 500);

            console.log('🍃 Sunils Tea Factory – using your local images from assets/TT/');
        })();
